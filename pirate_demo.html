<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☠️ Пиратский квиз: сокровища Окезнании</title>
<style>
  :root { --gold:#ffd166; --sea:#072a3f; --panel:#0e3a54; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
         background:linear-gradient(180deg,#041e2e,var(--sea)); color:#eef6fb; min-height:100vh; }
  h1 { margin:.3rem 0; font-size:1.6rem; }
  .wrap { max-width:1100px; margin:0 auto; padding:1rem; }
  .screen { display:none; }
  .screen.visible { display:block; }
  .panel { background:var(--panel); border-radius:12px; padding:1rem 1.25rem; margin-bottom:1rem;
           box-shadow:0 4px 14px rgba(0,0,0,.35); }
  button { background:#1d6fa5; color:#fff; border:none; border-radius:8px;
           padding:.6rem 1.1rem; font-size:1.05rem; cursor:pointer; margin:.25rem; }
  button:hover { background:#2a86c4; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.gold { background:#b8860b; }
  button.gold:hover { background:#d9a520; }
  input[type=text] { padding:.5rem .7rem; border-radius:6px; border:1px solid #3a7ca5;
                     background:#0a2e44; color:#eef6fb; font-size:1rem; min-width:220px; }
  label { display:block; margin:.5rem 0; }
  /* --- поле --- */
  #board { display:grid; gap:.6rem; margin:.8rem 0; }
  .cell { position:relative; aspect-ratio:1; border-radius:12px; cursor:pointer;
          background:#0a2e44; border:2px solid #3a7ca5; display:flex; flex-direction:column;
          align-items:center; justify-content:center; font-size:2.6rem; user-select:none;
          transition:transform .15s; }
  .cell:hover { transform:scale(1.03); }
  .cell.opened { cursor:default; background:#123f5c; }
  .cell.active-turn { border-color:var(--gold); box-shadow:0 0 14px rgba(255,209,102,.6); }
  .cell .tag { font-size:.75rem; margin-top:.3rem; color:#cfe6f5; }
  .cell .who { position:absolute; bottom:4px; font-size:.7rem; background:rgba(0,0,0,.4);
               padding:1px 6px; border-radius:6px; }
  /* --- команды --- */
  #teams { display:flex; gap:.8rem; flex-wrap:wrap; }
  .team { background:#0a2e44; border:2px solid #3a7ca5; border-radius:12px; padding:.6rem .9rem;
          min-width:200px; cursor:pointer; }
  .team.active { border-color:var(--gold); box-shadow:0 0 12px rgba(255,209,102,.5); }
  .team h3 { margin:.1rem 0 .4rem; font-size:1.15rem; }
  .team .cnt { font-size:1.9rem; font-weight:700; line-height:1.1; }
  .team .row { display:flex; gap:.3rem; flex-wrap:wrap; margin-top:.4rem; }
  .team .row button { font-size:.8rem; padding:.25rem .5rem; }
  /* --- модалки --- */
  .modal { position:fixed; inset:0; background:rgba(2,12,20,.86); display:none;
           align-items:center; justify-content:center; z-index:50; padding:1rem; }
  .modal.visible { display:flex; }
  .modal .card { background:var(--panel); border-radius:14px; padding:1.4rem;
                 max-width:760px; width:100%; max-height:92vh; overflow:auto; }
  .modal h2 { margin-top:0; }
  .modal .q { font-size:1.35rem; line-height:1.4; }
  .modal details { margin:.7rem 0; }
  .modal summary { cursor:pointer; color:var(--gold); font-size:1.05rem; }
  .timer { font-size:2.2rem; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; }
  .timer.out { color:#ff6b6b; }
  table { border-collapse:collapse; width:100%; margin:.6rem 0; }
  th,td { border:1px solid #3a7ca5; padding:.4rem .6rem; text-align:left; }
  .muted { color:#9fc3da; font-size:.9rem; }
  .center { text-align:center; }
  #phasebar { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
  #fasehead { font-size:1.25rem; font-weight:700; color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">

  <!-- ЭКРАН НАСТРОЙКИ -->
  <div class="screen visible" id="setup">
    <h1>☠️ Пиратский квиз: сокровища Окезнании</h1>
    <p class="muted">Экран для зала. Настройте партию — и в путь!</p>
    <div class="panel">
      <h2>Размер поля</h2>
      <button data-size="4">4 × 4 · ~15 минут</button>
      <button data-size="5">5 × 5 · ~25 минут</button>
      <div class="muted" id="sizeInfo">— не выбрано —</div>
    </div>
    <div class="panel">
      <h2>Команды</h2>
      <div id="setupTeams"></div>
      <button onclick="addTeam()">+ команда</button>
    </div>
    <div class="panel">
      <label><input type="checkbox" id="chestChk"> Сундуки (командные задания) — включить для длинной игры</label>
      <button class="gold" onclick="startGame()">⚓ Начать партию</button>
      <div class="muted" id="startHint"></div>
    </div>
  </div>

  <!-- ЭКРАН ИГРЫ -->
  <div class="screen" id="game">
    <div class="panel">
      <div class="center">
        <span id="fasehead"></span>
        <span class="timer" id="timerBox" style="margin-left:1rem">—:—</span>
        <span class="muted" style="margin-left:1rem">Ход: <b id="turnNo">—</b></span>
      </div>
      <div class="center" style="margin-top:.5rem">
        <button id="btnTask" onclick="dryTask()">📜 Задание на суше</button>
        <button id="btnPhase2" onclick="toPhase2()">🌊 Фаза 2</button>
        <button id="btnPhase1" onclick="toPhase1()" disabled>☁️ Фаза 1</button>
        <button onclick="finishGame()">🏁 Итоги</button>
      </div>
    </div>
    <div class="panel"><div id="teams"></div></div>
    <div class="panel"><div id="board"></div></div>
  </div>

</div>

<!-- МОДАЛКА ЗАДАЧИ -->
<div class="modal" id="taskModal"><div class="card">
  <h2 id="tmTitle"></h2>
  <div class="q" id="tmQ"></div>
  <details><summary>💡 Подсказка</summary><p id="tmHint"></p></details>
  <details><summary>✅ Ответ</summary><p id="tmAns"></p></details>
  <div class="center">
    <span class="timer" id="tmTimer">3:00</span>
    <div id="tmButtons"></div>
  </div>
</div></div>

<!-- МОДАЛКА ИТОГОВ -->
<div class="modal" id="endModal"><div class="card">
  <h2>🏁 Итоги плавания</h2>
  <div id="endScore"></div>
  <h3>🗺️ Бланк добычи: узлы карты знаний</h3>
  <div id="endNodes" class="muted"></div>
  <div class="center">
    <button class="gold" onclick="copyNodes()">📋 Скопировать список узлов</button>
    <button onclick="newGame()">🔄 Новая партия</button>
  </div>
</div></div>

<script>
"use strict";
// ============ ДАННЫЕ: 35 ЗАДАЧ (19 разминок, 5 ловушек, 6 сокровищ, 5 сундуков) ============
const TASKS = [
 // ---------- СУНДУКИ (командные, дискретная математика) ----------
 {id:"c1",node:"functions",type:"chest",level:3,title:"🧰 Сундук: биекция",
  q:"Правда ли, что сюръективность + инъективность = биективность? Обоснуйте.",
  hint:"Вспомните определения: «отображение на» и «разнозначное отображение».",
  a:"Да. Биекция = одновременная сюръекция (на всё множество) и инъекция (разнозначность)."},
 {id:"c2",node:"functions",type:"chest",level:3,title:"🧰 Сундук: образ объединения",
  q:"Правда ли, что образ объединения множеств совпадает с объединением их образов?",
  hint:"Рассмотрите произвольный элемент из объединения и примените отображение.",
  a:"Да: f(A∪B) = f(A)∪f(B) для любого отображения."},
 {id:"c3",node:"functions",type:"chest",level:3,title:"🧰 Сундук: образ пересечения",
  q:"Правда ли, что образ пересечения множеств совпадает с пересечением их образов?",
  hint:"Найдите контрпример на маленьких множествах.",
  a:"Не всегда: f(A∩B) ⊆ f(A)∩f(B), но равенство может нарушаться, если разные элементы переходят в один."},
 {id:"c4",node:"bool",type:"chest",level:3,title:"🧰 Сундук: полнота системы",
  q:"Правда ли, что система булевых функций из сложения по модулю 2 и конъюнкции является полной?",
  hint:"Попробуйте выразить отрицание и дизъюнкцию.",
  a:"Да: {⊕, ∧} полна — отрицание x̄ = x⊕1, а дизъюнкция выражается через ∧ и ⊕."},
 {id:"c5",node:"cardinality",type:"chest",level:3,title:"🧰 Сундук: мощность Q",
  q:"Какую мощность имеет множество рациональных чисел? Обоснуйте.",
  hint:"Пронумеруйте дроби зигзагом по числителю и знаменателю.",
  a:"Счётная: рациональные числа нумеруются диагональным процессом Кантора."},
 // ---------- ЛОВУШКИ ----------
 {id:"t1",node:"confusion",type:"trap",level:3,title:"⚠️ Ловушка: парадокс 99%",
  q:"Модель предсказывает «здоров» всем. Точность 99%. Сколько больных она найдёт из 10 000 человек, если больных 1%?",
  hint:"Точность считается по всем примерам, а не по больным.",
  a:"Ноль. Модель всегда говорит «здоров»: точность 99% = 9900/10000, но recall по больным = 0."},
 {id:"t2",node:"cardinality",type:"trap",level:3,title:"⚠️ Ловушка: иррациональные",
  q:"Какую мощность имеет множество иррациональных чисел?",
  hint:"Что больше: счётное множество или континуум? А их разность?",
  a:"Мощность континуума (несчётно): вычитание счётного множества из континуума не меняет мощность."},
 {id:"t3",node:"probability",type:"trap",level:3,title:"⚠️ Ловушка: дни рождения",
  q:"Сколько людей нужно в комнате, чтобы вероятность совпадения дней рождения хотя бы у двух превысила 50%? Интуиция против расчёта!",
  hint:"Считайте пары: n(n−1)/2, а не людей.",
  a:"Всего 23 человека (вероятность 50,7%)."},
 {id:"t4",node:"combinatorics",type:"trap",level:2,title:"⚠️ Ловушка: два орла",
  q:"Сколькими способами можно выбрать два «орла» из четырёх монет? Порядок выбора не имеет значения.",
  hint:"Это сочетания, не размещения.",
  a:"C(4,2) = 6 способов."},
 {id:"t5",node:"complexity",type:"trap",level:3,title:"⚠️ Ловушка: порядок роста",
  q:"Что растёт быстрее при больших n: O(n²) или O(2ⁿ)? А O(n·log n) против O(n²)?",
  hint:"Подставьте n = 100 в оба выражения.",
  a:"O(2ⁿ) растёт быстрее любого полинома; n·log n медленнее n²."},
 // ---------- СОКРОВИЩА ----------
 {id:"s1",node:"regression",type:"treasure",level:2,title:"💰 Сокровище: регрессия",
  q:"Какую величину минимизирует метод наименьших квадратов в линейной регрессии?",
  hint:"Речь о среднем квадрате… чего?",
  a:"Сумму (среднее) квадратов отклонений предсказаний от фактических значений (MSE)."},
 {id:"s2",node:"bayes",type:"treasure",level:2,title:"💰 Сокровище: Байес",
  q:"Запишите формулу Байеса и объясните словами, что такое априорная и апостериорная вероятности.",
  hint:"P(H|E) = …",
  a:"P(H|E) = P(E|H)·P(H)/P(E). Априорная — до данных, апостериорная — после наблюдения E."},
 {id:"s3",node:"montecarlo",type:"treasure",level:2,title:"💰 Сокровище: Монте-Карло π",
  q:"Как оценить число π методом Монте-Карло с помощью случайных точек в квадрате?",
  hint:"Впишите квадрат в четверть круга и считайте долю точек.",
  a:"Доля точек в круге ≈ π/4; умножаем на 4 и получаем оценку π."},
 {id:"s4",node:"matrices",type:"treasure",level:2,title:"💰 Сокровище: поворот",
  q:"Какой матрицей задаётся поворот вектора на угол φ на плоскости?",
  hint:"Две строки, четыре числа, косинусы и синусы.",
  a:"[[cos φ, −sin φ],[sin φ, cos φ]]."},
 {id:"s5",node:"hashtables",type:"treasure",level:2,title:"💰 Сокровище: коллизии",
  q:"Что такое коллизия в хеш-таблице и какова вероятность совпадения дней рождения у 23 людей? (Подсказка: это одно и то же явление.)",
  hint:"Ключи и корзины.",
  a:"Совпадение хешей у разных ключей; при 23 людях и 365 «корзинах» вероятность ≈ 50,7%."},
 {id:"s6",node:"confusion",type:"treasure",level:2,title:"💰 Сокровище: точность и полнота",
  q:"Модель нашла 80 из 100 больных (precision 90%). Чему равен recall, если всего больных 200?",
  hint:"Recall = найденные / все настоящие.",
  a:"80/200 = 0,4 (40%)."},
 // ---------- РАЗМИНКИ ----------
 {id:"w1",node:"vectors",type:"warmup",level:1,q:"Что такое скалярное произведение векторов и как его вычислить?",
  hint:"Сумма произведений координат.",a:"a·b = a₁b₁ + a₂b₂ + …; геометрически |a||b|cos φ."},
 {id:"w2",node:"vectors",type:"warmup",level:1,q:"Когда два вектора ортогональны?",
  hint:"Посмотрите на скалярное произведение.",a:"Когда их скалярное произведение равно нулю."},
 {id:"w3",node:"sets",type:"warmup",level:1,q:"Чем объединение множеств отличается от пересечения?",
  hint:"«Или» против «и».",a:"Объединение A∪B — элементы хотя бы одного; пересечение A∩B — элементы обоих."},
 {id:"w4",node:"sets",type:"warmup",level:1,q:"Что такое мощность множества?",
  hint:"Сколько…?",a:"Число его элементов (для конечных множеств)."},
 {id:"w5",node:"complexity",type:"warmup",level:1,q:"Что означает запись O(n) для алгоритма?",
  hint:"Как растёт время при росте входа.",a:"Время растёт линейно с размером входа (с точностью до констант)."},
 {id:"w6",node:"complexity",type:"warmup",level:1,q:"Сравните O(log n) и O(n): что быстрее на больших n?",
  hint:"Подставьте n = 1 000 000.",a:"O(log n): логарифм растёт несравнимо медленнее."},
 {id:"w7",node:"recursion",type:"warmup",level:1,q:"Что обязательно должно быть в рекурсивной функции, чтобы она не зациклилась?",
  hint:"Условие выхода.",a:"Базовый случай (условие остановки рекурсии)."},
 {id:"w8",node:"recursion",type:"warmup",level:1,q:"Выпишите рекуррентную формулу для чисел Фибоначчи.",
  hint:"F(0)=0, F(1)=1, а дальше?",a:"F(n) = F(n−1) + F(n−2)."},
 {id:"w9",node:"functions",type:"warmup",level:1,q:"Назовите синоним понятия «разнозначное отображение».",
  hint:"Другое название инъективности.",a:"Инъективное отображение."},
 {id:"w10",node:"functions",type:"warmup",level:1,q:"Назовите синоним понятия «отображение на».",
  hint:"Другое название сюръективности.",a:"Сюръективное отображение."},
 {id:"w11",node:"cardinality",type:"warmup",level:1,q:"Что значит «равномощность множеств»?",
  hint:"Между ними существует…",a:"Существует биекция между ними."},
 {id:"w12",node:"matrices",type:"warmup",level:1,q:"Что такое единичная матрица?",
  hint:"Единицы на…",a:"Квадратная матрица с единицами на главной диагонали; A·E = A."},
 {id:"w13",node:"matrices",type:"warmup",level:1,q:"Как умножить матрицу на вектор?",
  hint:"Строка на столбец.",a:"Каждая строка матрицы скалярно умножается на вектор."},
 {id:"w14",node:"probability",type:"warmup",level:1,q:"В каких пределах лежит вероятность любого события?",
  hint:"От… до…",a:"От 0 до 1 включительно."},
 {id:"w15",node:"probability",type:"warmup",level:1,q:"Монета бросается 1 раз. Вероятность орла?",
  hint:"Классическое определение.",a:"1/2."},
 {id:"w16",node:"hashtables",type:"warmup",level:1,q:"Зачем нужна хеш-функция в хеш-таблице?",
  hint:"Она переводит ключ в…",a:"Преобразует ключ в индекс корзины для быстрого доступа O(1) в среднем."},
 {id:"w17",node:"hashtables",type:"warmup",level:1,q:"Что хуже для хеш-таблицы: много корзин или много коллизий?",
  hint:"Что замедляет поиск?",a:"Много коллизий — поиск вырождается в перебор списка."},
 {id:"w18",node:"regression",type:"warmup",level:1,q:"Чем регрессия отличается от классификации?",
  hint:"Число или метка?",a:"Регрессия предсказывает непрерывное число, классификация — метку класса."},
 {id:"w19",node:"bayes",type:"warmup",level:1,q:"Что такое условная вероятность P(A|B)?",
  hint:"Вероятность A при условии…",a:"Вероятность события A при условии, что B произошло: P(A|B) = P(A∩B)/P(B)."}
];
window.TASKS = TASKS;

const RARE_ID = "t3"; // задача про дни рождения — редкое сокровище (гонка)
const SIZES = {
  4:{treasure:4, trap:3, chest:1, warmup:8},
  5:{treasure:6, trap:5, chest:1, warmup:13}
};

// ============ СОСТОЯНИЕ ============
let S = null;
const $ = id => document.getElementById(id);
const show = (id,on) => $(id).classList.toggle("visible",on);

function save(){ try{ localStorage.setItem("pirate_demo", JSON.stringify(S)); }catch(e){} }
function loadState(){
  try{ const s = localStorage.getItem("pirate_demo"); return s? JSON.parse(s):null; }catch(e){ return null; }
}
function clearState(){ localStorage.removeItem("pirate_demo"); }

// ============ НАСТРОЙКА ============
const setupTeams = [];
function addTeam(){
  const n = setupTeams.length + 1;
  setupTeams.push({name:"Команда " + n});
  renderSetupTeams();
}
function renderSetupTeams(){
  const box = $("setupTeams"); box.innerHTML = "";
  setupTeams.forEach((t,i)=>{
    const d = document.createElement("div");
    d.style.margin = ".3rem 0";
    d.innerHTML = `<input type="text" value="${t.name.replace(/"/g,"&quot;")}"
      oninput="setupTeams[${i}].name=this.value" placeholder="Название команды">`;
    box.appendChild(d);
  });
}
document.querySelectorAll("[data-size]").forEach(b=>{
  b.onclick = ()=>{ S = Object.assign(loadState()||{}, {size:+b.dataset.size}); renderSizeInfo(); };
});
function renderSizeInfo(){
  $("sizeInfo").textContent = S && S.size ? ("Выбрано поле " + S.size + "×" + S.size) : "— не выбрано —";
}
function startGame(){
  if(!S || !S.size){ $("startHint").textContent = "Сначала выберите размер поля!"; return; }
  if(setupTeams.length < 1){ $("startHint").textContent = "Добавьте хотя бы одну команду!"; return; }
  const useChest = $("chestChk").checked;
  const cnt = Object.assign({}, SIZES[S.size]);
  if(!useChest){ cnt.warmup += cnt.chest; cnt.chest = 0; }
  // жеребьёвка
  const buckets = {warmup:[], trap:[], treasure:[], chest:[]};
  TASKS.forEach((t,i)=>buckets[t.type].push(i));
  const picked = [];
  for(const type of ["chest","treasure","trap","warmup"]){
    shuffle(buckets[type]);
    picked.push(...buckets[type].slice(0, cnt[type]));
  }
  shuffle(picked);
  S = {
    size:S.size,
    teams: setupTeams.map(t=>({name:t.name||"Команда", o2:0, tr:0, bridge:false})),
    board: picked.map(id=>({id, opened:false, team:null, result:null})),
    phase:1, turn:1, active:0, dryUsed:[], rareWinner:null,
    started:true, finished:false
  };
  save();
  show("setup",false); show("game",true);
  renderAll();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }
function task(id){ return TASKS.find(t=>t.id===id); }

// ============ РЕНДЕР ============
function renderAll(){ renderHead(); renderTeams(); renderBoard(); save(); }
function renderHead(){
  $("fasehead").textContent = "Фаза " + S.phase + (S.phase===1 ? " · На суше" : " · Погружение");
  $("turnNo").textContent = S.turn;
  $("btnPhase2").disabled = S.phase===2;
  $("btnPhase1").disabled = S.phase===1;
}
function renderTeams(){
  const box = $("teams"); box.innerHTML = "";
  S.teams.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "team" + (i===S.active && S.phase===2 ? " active":"");
    d.innerHTML = `<h3>${esc(t.name)}${i===S.active && S.phase===2 ? " ⬅" : ""}</h3>
      <div>О₂: <span class="cnt">${t.o2}</span> &nbsp; 💰: <span class="cnt">${t.tr}</span></div>
      <div class="row">
        <button onclick="giveO2(${i},1)">+1</button>
        <button onclick="giveO2(${i},2)">+2</button>
        <button onclick="giveO2(${i},3)">+3</button>
        <button onclick="giveO2(${i},-1)">−1</button>
        <button onclick="bridge(${i})" ${t.bridge?"disabled":""}>🌉 мостик +1</button>
      </div>`;
    d.onclick = e => { if(e.target.tagName!=="BUTTON"){ S.active=i; renderAll(); } };
    box.appendChild(d);
  });
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function giveO2(i,delta){
  S.teams[i].o2 = Math.max(0, S.teams[i].o2 + delta);
  renderAll();
}
function bridge(i){
  if(S.teams[i].bridge) return;
  S.teams[i].bridge = true; S.teams[i].o2++;
  renderAll();
}
function renderBoard(){
  const n = S.size, box = $("board");
  box.style.gridTemplateColumns = `repeat(${n},1fr)`;
  box.innerHTML = "";
  const icons = {treasure:"❓", trap:"❓", chest:"❓", warmup:"❓"};
  S.board.forEach((c,i)=>{
    const t = task(c.id);
    const d = document.createElement("div");
    const isRare = t.id===RARE_ID;
    if(!c.opened){
      d.className = "cell";
      if(S.phase===2 && i===S.active) d.classList.add("active-turn");
      d.innerHTML = "🌊" + (isRare? '<div class="tag">✨ редкое</div>':'');
      d.onclick = ()=>openCell(i);
    } else {
      d.className = "cell opened";
      const mark = c.result==="win" ? "💰" : (c.result==="lose" ? "☠️" : "⬜");
      d.innerHTML = `${mark}<div class="who">${esc(c.team||"")}</div>`;
    }
    box.appendChild(d);
  });
}

// ============ ФАЗА 1 ============
let timerH = null;
function dryTask(){
  const pool = TASKS.filter(t=>t.type!=="chest" && t.id!==RARE_ID && !S.dryUsed.includes(t.id));
  if(!pool.length){ alert("Задания на суше закончились!"); return; }
  const t = pool[Math.floor(Math.random()*pool.length)];
  S.dryUsed.push(t.id); save();
  openTaskModal(t, "Задание на суше", true);
}
function openTaskModal(t, title, withTimer){
  $("tmTitle").textContent = (title||"") + " · " + (t.title || ("Сложность " + t.level));
  $("tmQ").textContent = t.q;
  $("tmHint").textContent = t.hint;
  $("tmAns").textContent = t.a;
  const btns = $("tmButtons"); btns.innerHTML = "";
  const close = document.createElement("button");
  close.textContent = "Закрыть"; close.onclick = closeModal;
  btns.appendChild(close);
  show("taskModal",true);
  if(withTimer) startTimer(180, $("tmTimer"));
}
function closeModal(){
  show("taskModal",false);
  if(timerH){ clearInterval(timerH); timerH=null; }
}

// ============ ФАЗА 2 ============
function toPhase2(){
  S.phase = 2; S.active = 0; save(); renderAll();
}
function toPhase1(){
  S.phase = 1; S.turn++; save(); renderAll();
}
function openCell(i){
  if(S.phase!==1) {} // переход не требуется
  const c = S.board[i];
  if(c.opened) return;
  const team = S.teams[S.active];
  if(team.o2 < 1){ alert("У команды «" + team.name + "» нет кислорода! Выдайте задание на суше."); return; }
  team.o2--;
  c.opened = true; c.team = team.name;
  const t = task(c.id);
  if(t.id===RARE_ID){ // редкое сокровище: гонка всех команд
    openRaceModal(t);
    return;
  }
  if(t.type==="treasure"){
    c.result = "win"; team.tr++;
    openTaskModal(t, "💰 Сокровище команды «" + team.name + "»", false);
  } else if(t.type==="trap"){
    openTrapModal(t, c);
  } else if(t.type==="chest"){
    openChestModal(t, c);
  } else {
    c.result = "empty";
    openTaskModal(t, "Пустая клетка — разминка", false);
  }
  nextActive();
  renderAll();
}
function openTrapModal(t, c){
  $("tmTitle").textContent = "⚠️ Ловушка! Команда «" + c.team + "»";
  $("tmQ").textContent = t.q;
  $("tmHint").textContent = t.hint;
  $("tmAns").textContent = t.a;
  const btns = $("tmButtons"); btns.innerHTML = "";
  const b1 = document.createElement("button"); b1.className="gold"; b1.textContent="💪 Преодолели (+💰)";
  b1.onclick = ()=>{ c.result="win"; teamOf(c.team).tr++; closeModal(); renderAll(); };
  const b2 = document.createElement("button"); b2.textContent="☠️ Не справились";
  b2.onclick = ()=>{ c.result="lose";
    const team = teamOf(c.team);
    if(team.tr>0) team.tr--;
    team.o2 = 0;
    closeModal(); renderAll(); };
  btns.append(b1,b2);
  show("taskModal",true);
}
function openChestModal(t, c){
  $("tmTitle").textContent = "🧰 Сундук! Командное задание";
  $("tmQ").textContent = t.q;
  $("tmHint").textContent = t.hint;
  $("tmAns").textContent = t.a;
  const btns = $("tmButtons"); btns.innerHTML = "";
  const b1 = document.createElement("button"); b1.className="gold"; b1.textContent="🔓 Вскрыли (+2 💰)";
  b1.onclick = ()=>{ c.result="win"; teamOf(c.team).tr+=2; closeModal(); renderAll(); };
  const b2 = document.createElement("button"); b2.textContent="🔒 Не вскрыли";
  b2.onclick = ()=>{ c.result="empty"; closeModal(); renderAll(); };
  btns.append(b1,b2);
  show("taskModal",true);
}
function openRaceModal(t){
  $("tmTitle").textContent = "✨ РЕДКОЕ СОКРОВИЩЕ · Отвечают все команды наперегонки!";
  $("tmQ").textContent = t.q;
  $("tmHint").textContent = t.hint;
  $("tmAns").textContent = "Победитель — команда, назвавшая n быстрее и точнее.";
  const btns = $("tmButtons"); btns.innerHTML = "";
  S.teams.forEach((team,i)=>{
    const b = document.createElement("button"); b.className="gold";
    b.textContent = "🏆 " + team.name;
    b.onclick = ()=>{
      const cellIdx = S.board.findIndex(c=>c.id===RARE_ID && c.opened);
      if(cellIdx>=0){ S.board[cellIdx].result="win"; S.board[cellIdx].team = team.name; }
      team.tr++;
      S.rareWinner = team.name;
      closeModal(); renderAll();
    };
    btns.appendChild(b);
  });
  show("taskModal",true);
}
function teamOf(name){ return S.teams.find(t=>t.name===name) || S.teams[0]; }
function nextActive(){
  for(let k=1;k<=S.teams.length;k++){
    const i = (S.active+k) % S.teams.length;
    if(S.teams[i].o2>0){ S.active=i; return; }
  }
  // никто не имеет кислорода — остаёмся
}

// ============ ТАЙМЕР ============
function startTimer(sec, el){
  if(timerH) clearInterval(timerH);
  let left = sec;
  const draw = ()=>{
    const m = Math.floor(left/60), s = left%60;
    el.textContent = m + ":" + String(s).padStart(2,"0");
    el.classList.toggle("out", left<=0);
  };
  draw();
  timerH = setInterval(()=>{
    left--; draw();
    if(left<=0){ clearInterval(timerH); timerH=null; el.textContent="⏰ Время вышло!"; }
  },1000);
}

// ============ ИТОГИ ============
function finishGame(){
  const score = S.teams.map(t=>({name:t.name, tr:t.tr})).sort((a,b)=>b.tr-a.tr);
  $("endScore").innerHTML = "<table><tr><th>Место</th><th>Команда</th><th>💰</th></tr>" +
    score.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.tr}</td></tr>`).join("") + "</table>";
  const mined = {};
  S.board.forEach(c=>{ if(c.result==="win" && c.team){ mined[c.team] = mined[c.team]||[]; mined[c.team].push(task(c.id).node); } });
  const uniq = [...new Set(Object.values(mined).flat())];
  $("endNodes").innerHTML = uniq.length
    ? uniq.map(n=>`• ${n} — ${Object.entries(mined).filter(([,v])=>v.includes(n)).map(([k])=>k).join(", ")}`).join("<br>")
    : "Узлов не добыто.";
  show("endModal",true);
}
function copyNodes(){
  const mined = {};
  S.board.forEach(c=>{ if(c.result==="win" && c.team){ mined[c.team] = mined[c.team]||[]; mined[c.team].push(task(c.id).node); } });
  const uniq = [...new Set(Object.values(mined).flat())];
  const text = "ta_progress_узлы: " + uniq.join(", ");
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(
    ()=>alert("Скопировано: " + text),
    ()=>alert("Не удалось скопировать. Узлы: " + uniq.join(", "))
  );
}
function newGame(){
  clearState();
  show("endModal",false); show("game",false); show("setup",true);
  S = null; renderSizeInfo();
}

// ============ ВОССТАНОВЛЕНИЕ ПАРТИИ ============
(function boot(){
  const saved = loadState();
  if(saved && saved.started && !saved.finished &&
     confirm("Обнаружена незавершённая партия. Продолжить?")){
    S = saved;
    show("setup",false); show("game",true);
    renderAll();
  } else if(saved && saved.started){ clearState(); }
})();
</script>
</body>
