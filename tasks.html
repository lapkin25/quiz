<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Минутные задачки</title>
<style>
  :root { --bg:#fafafa; --card:#ffffff; --ink:#1c1c1e; --muted:#6b6b70; --line:#e4e4e7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:24px 16px 8px; max-width:760px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .note { color:var(--muted); font-size:.92rem; margin:0 0 16px; }
  .bar { position:sticky; top:0; background:var(--bg); padding:10px 16px; max-width:760px; margin:0 auto;
         border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; align-items:center; z-index:5; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 14px;
          font-size:.85rem; cursor:pointer; user-select:none; }
  .chip.active { color:#fff; border-color:transparent; }
  .counter { margin-left:auto; font-size:.85rem; color:var(--muted); }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h2 { font-size:1.05rem; margin:28px 0 12px; display:flex; align-items:center; gap:10px; }
  h2 .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
  .task { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .task.done { opacity:.55; }
  .task h3 { margin:0 0 8px; font-size:1rem; }
  .task .q { margin:0 0 10px; }
  details { margin:6px 0; }
  summary { cursor:pointer; font-weight:600; font-size:.9rem; color:var(--muted); }
  details p { margin:8px 0 0; }
  .bridge { margin-top:10px; padding:10px 12px; background:#f4f6fb; border-left:3px solid var(--line); border-radius:0 8px 8px 0; font-size:.9rem; }
  .done-btn { margin-top:10px; border:1px solid var(--line); background:transparent; border-radius:8px;
              padding:6px 12px; font-size:.85rem; cursor:pointer; }
  .done-btn.on { background:var(--ink); color:#fff; border-color:var(--ink); }
</style>
</head>
<body>
<header>
  <h1>Минутные задачки</h1>
  <p class="note" id="note"></p>
</header>
<div class="bar" id="bar"></div>
<main id="main"></main>
<script>
const DATA = {"meta": {"title": "Минутные задачки", "note": "По одной задаче на каждый узел графа знаний. Сначала подумайте, потом открывайте подсказку и ответ.", "progress_key": "tasks_done"}, "layers": [{"id": "fundamental", "title": "Фундамент", "color": "#4e79a7", "nodes": [{"id": "vectors", "title": "Векторы", "task": {"q": "Ветер дует с северо-востока со скоростью 5 м/с. Запишите его как пару чисел.", "hint": "Выберите, куда смотрят оси: пусть ось x — на восток, ось y — на север.", "a": "Получится пара (−3,5; 3,5) (5·cos(135°), 5·sin(135°)). Знаки важнее чисел: минус у x означает «дует на запад», плюс у y — «дует на север». Вектор — это направление и длина, а не точка.", "bridge": "К матрицам: матрица — это способ превратить один набор векторов в другой."}}, {"id": "matrix", "title": "Матрицы", "task": {"q": "Поворот на 90° против часовой стрелки: какая матрица это делает?", "hint": "Куда переходят базисные векторы (1,0) и (0,1)? Они и есть столбцы матрицы.", "a": "[[0, −1], [1, 0]]: вектор (1,0) переходит в (0,1), вектор (0,1) — в (−1,0). Столбцы матрицы — это образы базисных векторов, поэтому «прочитать» любое линейное преобразование можно прямо по столбцам.", "bridge": "К МНК: там матрица переводит данные в предсказания — тот же приём, только столбцы задают признаки."}}, {"id": "eigenvalues", "title": "Собственные значения", "task": {"q": "Матрица растягивает всё в 2 раза и ничего не поворачивает. Каковы её собственные значения?", "hint": "Собственный вектор — тот, который при умножении не меняет направления. Что происходит с его длиной?", "a": "Оба собственных значения равны 2. Растяжение в k раз умножает длину любого вектора на k — значит, det(A − λE) = (2 − λ)². Смысл собственных значений — «коэффициенты растяжения» вдоль особых направлений.", "bridge": "К МНК: там собственные значения показывают, какие направления данных «перекошены» — отсюда проблемы мультиколлинеарности."}}, {"id": "sets", "title": "Множества", "task": {"q": "В группе 20 студентов: 12 играют в шахматы, 10 — в шашки, 4 — и в то, и в другое. Сколько не играет ни во что?", "hint": "Сложите 12 и 10 — кого вы посчитали дважды?", "a": "12 + 10 − 4 = 18 играют хотя бы во что-то, значит 2 человека не играют. Формула включений-исключений: сумма минус пересечение. Без вычитания двойного счёта ответ уплывает.", "bridge": "К логике: операции над множествами и операции над высказываниями — это одна и та же алгебра в двух костюмах."}}, {"id": "logic", "title": "Логика высказываний", "task": {"q": "Высказывание «если я сдам экзамен, то поеду на море» ложно. Что известно про экзамен и про море?", "hint": "Импликация ложна только в одном случае: посылка истинна, а следствие — нет.", "a": "Экзамен сдан, а на море не поехали. Импликация A→B истинна во всех случаях, кроме A=истина, B=ложь — люди часто путают это с «B следует только из A».", "bridge": "К булевым функциям: та же импликация — это схема из двух транзисторов, только записанная словами."}}, {"id": "boolean", "title": "Булевы функции", "task": {"q": "Составьте функцию «свет в комнате»: два выключателя, любой из них меняет состояние света.", "hint": "Когда свет горит? Когда ровно один выключатель в «другом» положении, чем раньше.", "a": "Это XOR: свет = A ⊕ B. Нажали любой выключатель — свет переключился, нажали оба — вернулся как был. XOR — «переключатель», а OR — «хотя бы один», их не путать.", "bridge": "К логике: любая формула логики высказываний — это схема из XOR, AND, OR и NOT. Ровно так проектируют процессоры."}}, {"id": "combinatorics", "title": "Комбинаторика", "task": {"q": "Сколько способов расставить 8 ладей на шахматной доске так, чтобы они не били друг друга?", "hint": "Каждая ладья занимает свой ряд и свою колонку. Первая — 8 вариантов колонки, вторая — 7…", "a": "8! = 40320. Это перестановки: каждой строке — своя колонка. Любая биекция между строками и колонками и есть расстановка.", "bridge": "К вероятности: вероятность = число «хороших» исходов, делённое на общее число — а общее число умеет считать только комбинаторика."}}, {"id": "probability", "title": "Вероятность", "task": {"q": "В семье двое детей, известно: хотя бы один — мальчик. Какова вероятность, что оба — мальчики?", "hint": "Выпишите все четыре равновероятных исхода и вычеркните неподходящие.", "a": "Из четырёх исходов (ММ, МД, ДМ, ДД) условие отсекает только ДД, остаётся 3, из них ММ — один. Ответ 1/3, а не 1/2: условие меняет пространство исходов.", "bridge": "К формуле Байеса: здесь мы уже неявно пересчитали вероятность по новым данным — Байес делает это систематически."}}, {"id": "randomvars", "title": "Случайные величины", "task": {"q": "Игра: платите 10 ₽, бросаем кубик, вам платят число очков в рублях. Выгодна ли игра?", "hint": "Сравните средний выигрыш со ставкой.", "a": "Средний выигрыш (1+2+…+6)/6 = 3,5 ₽ при ставке 10 ₽ — игра невыгодна, проигрыш в среднем 6,5 ₽ за бросок. Матожидание — это «среднее за долгую игру», и оно бьёт интуицию про «иногда повезёт».", "bridge": "К Монте-Карло: вместо расчёта матожидания можно просто много раз бросить кубик — сходится к тому же ответу."}}, {"id": "graphs", "title": "Графы", "task": {"q": "На вечеринке 5 человек, каждый знаком ровно с тремя остальными. Возможно ли это?", "hint": "Посчитайте сумму степеней всех вершин.", "a": "Нет: сумма степеней 5·3 = 15 — нечётна, а она обязана быть чётной (каждое знакомство считается дважды). Лемма о рукопожатиях отсекает половину «наивных» конструкций.", "bridge": "К матрицам: знакомства можно записать матрицей смежности — и граф превращается в объект линейной алгебры."}}, {"id": "bignum", "title": "O-нотация", "task": {"q": "Двойной цикл по массиву из n элементов: O(n²). А цикл внутри цикла, где внутренний делает n/2 шагов?", "hint": "Константы (½, 2, 100) в O-нотации исчезают. Почему?", "a": "Всё равно O(n²): ½·n² растёт как n², а константа — деталь реализации. O-нотация описывает масштаб роста, а не точное число шагов; при n = миллион разница между 0,5n² и n² — секунды, между n² и n³ — минуты.", "bridge": "К сортировкам: весь спор «пузырёк против быстрой» — это спор об O(n²) и O(n·log n)."}}, {"id": "recursion", "title": "Рекурсия", "task": {"q": "Башня из 5 дисков: сколько перекладываний минимально нужно?", "hint": "Для n дисков перекладываний 2ⁿ − 1. Проверьте: 1 → 1, 2 → 3, 3 → 7.", "a": "2⁵ − 1 = 31. Рекуррентность T(n) = 2T(n−1) + 1 раскручивается в 2ⁿ − 1. Рекурсия — это не «функция вызывает себя», а «задача сводится к меньшей себе», и это даёт формулу.", "bridge": "К ДП: там мы убираем повторные вызовы рекурсии кэшем — и экспонента падает до полинома."}}]}, {"id": "instrument", "title": "Инструменты", "color": "#f28e2b", "nodes": [{"id": "linear-systems", "title": "СЛАУ и Гаусс", "task": {"q": "Два товара: ручка и блокнот. 3 ручки + 2 блокнота = 190 ₽, 1 ручка + 1 блокнот = 70 ₽. Сколько стоит блокнот?", "hint": "Вычтите второе уравнение из первого (умноженного на 3) — исчезнет неизвестное.", "a": "Вычитание даёт −блокнот = −20, то есть блокнот = 20? Проверьте: 1 ручка = 50 ₽, тогда 3·50 + 2·20 = 190 ✓. Метод исключения Гаусса — просто вычитание уравнений, доведённое до системы.", "bridge": "К МНК: когда уравнений больше, чем неизвестных, точного решения нет — и нужна та самая «минимальная ошибка»."}}, {"id": "mnk", "title": "МНК", "task": {"q": "Точки (0,0), (1,2), (2,4). Прямая y = kx проходит точно через все. А если добавить точку (3,5)?", "hint": "Идеальной прямой уже нет. Что минимизировать?", "a": "Минимизируем сумму квадратов отклонений: для y=kx получим k = Σxy/Σx² = (0+2+8+15)/(0+1+4+9) = 25/14 ≈ 1,79. Ни одна прямая не пройдёт через все 4 точки — МНК находит компромисс, а не чудо.", "bridge": "К регрессии: регрессия — это МНК плюс осмысленная постановка задачи «предсказать»."}}, {"id": "bayes-theorem", "title": "Формула Байеса", "task": {"q": "Тест на болезнь точен на 99%. Болезнь у 1 из 1000. Тест положительный — какова вероятность болезни?", "hint": "Считайте через доли: на 10 000 человек сколько больных и сколько ложных срабатываний?", "a": "Больных ~10, из них тест сработает у ~9,9. Здоровых 9990, ложных срабатываний ~100. Итого положительных ~110, из них больных ~10. Ответ ≈ 9%. Интуиция кричит «99%», и она ошибается в десять раз.", "bridge": "К наивному Байесу: спам-фильтр — это сотня таких «тестов» (слов), перемноженных по Байесу."}}, {"id": "montecarlo", "title": "Монте-Карло", "task": {"q": "Как оценить площадь кляксы на листе 10×10 см, не имея формулы её площади?", "hint": "Накидайте точки равномерно и посчитайте долю попавших в кляксу.", "a": "Доля точек внутри кляксы ≈ доля площади. 10 000 случайных точек дают площадь с ошибкой ~0,5% (ошибка убывает как 1/√N). Никакой формулы не нужно — только честный счёт.", "bridge": "К случайным величинам: метод честно работает, только если генератор даёт равномерные независимые точки — то есть опирается на теорию вероятностей."}}, {"id": "sorting", "title": "Сортировки", "task": {"q": "Колода уже почти отсортирована, кроме последней карты. Пузырёк — сколько проходов? Быстрая сортировка — как поведёт себя?", "hint": "У пузырька есть флаг «менялось ли что-то за проход». А у быстрой — есть неудачный выбор опоры.", "a": "Пузырёк с флагом — один проход, O(n) в лучшем случае. Быстрая сортировка в худшем (отсортированный массив и опора в краю) — O(n²). «Почти отсортировано» — это плюс для одного алгоритма и минус для другого.", "bridge": "К O-нотации: «быстрая» сортировка медленнее «медленной» в частных случаях — асимптотика говорит о среднем, а не о вашем массиве."}}, {"id": "binary-search", "title": "Бинарный поиск", "task": {"q": "Угадай число от 1 до 1000 за наименьшее число вопросов «больше/меньше». Сколько нужно в худшем случае?", "hint": "Каждый вопрос делит диапазон пополам. 2 в какой степени ≥ 1000?", "a": "10 вопросов: 2¹⁰ = 1024 ≥ 1000. Логарифм — это «сколько раз можно делить пополам». Миллион элементов — 20 вопросов, миллиард — 30.", "bridge": "К деревьям: бинарный поиск по массиву и поиск в двоичном дереве — одна и та же идея в разной упаковке."}}, {"id": "trees", "title": "Деревья", "task": {"q": "Файлы на диске: папки вложены в папки. Почему это дерево, а не произвольный граф?", "hint": "Может ли папка содержать саму себя (напрямую или через цепочку)?", "a": "Потому что у каждой папки ровно один «родитель» и нет циклов — иначе путь к файлу был бы неоднозначным. Дерево = связный граф без циклов, и ОС на этом строит весь интерфейс.", "bridge": "К хеш-таблицам: обе структуры ищут элемент за O(log n) или O(1) — выбор между ними зависит от того, нужен ли порядок."}}, {"id": "hash-tables", "title": "Хеш-таблицы", "task": {"q": "В классе 30 человек. Насколько вероятно, что у двоих день рождения в один день?", "hint": "Это не 30/365! Считайте вероятность противоположного: у всех дни разные.", "a": "Вероятность совпадения ≈ 1 − 365·364·…·336/365³⁰ ≈ 71%. Парадокс дней рождения: коллизии неизбежны и наступают раньше, чем кажется, — ровно поэтому в хеш-таблицах обязана быть обработка коллизий.", "bridge": "К графам: и там, и там Surprise приходит из быстрого роста числа пар (n(n−1)/2), а не из линейного роста n."}}, {"id": "bfs-dfs", "title": "BFS и DFS", "task": {"q": "Обойти все файлы в папке с подпапками: что выбрать — обход «в ширину» или «в глубину»?", "hint": "В чём разница на практике? Какая структура данных у каждого в руках?", "a": "DFS (рекурсия/стек) естественен для файловой системы: зашёл в папку — дошёл до листа — вернулся. BFS (очередь) дал бы файлы «по уровням вложенности». Оба честно обходят всё, но порядок различен и по-разному удобен.", "bridge": "К Дейкстре: BFS находит кратчайший путь по числу шагов, Дейкстра — по сумме весов. Когда рёбра «стоят» одинаково, BFS — частный случай Дейкстры."}}, {"id": "dijkstra", "title": "Дейкстра", "task": {"q": "Вес рёбер может быть отрицательным. Работает ли Дейкстра?", "hint": "Подумайте: как алгоритм решает, что вершина «финализирована»?", "a": "Нет. Дейкстра фиксирует вершину, когда достал её из очереди, и не пересматривает. Отрицательное ребро может позже дать более короткий путь — и ответ окажется неверным. Для отрицательных весов нужен Беллман–Форд.", "bridge": "К навигации: навигатор на отрицательных весах посоветовал бы «прокатиться по кругу ради скидки» — реальность так не работает, поэтому веса там неотрицательны."}}, {"id": "dp", "title": "Динамическое программирование", "task": {"q": "Рекурсивный Фибоначчи делает ~2ⁿ вызовов. Сколько различных подзадач у него вообще есть?", "hint": "fib(n) зависит от fib(n−1) и fib(n−2). Сколько разных аргументов возможно?", "a": "Всего n подзадач (fib(1)…fib(n)) — а вызовов 2ⁿ. Значит, почти все вызовы повторные. Кэш (таблица) сокращает до O(n): ДП — это рекурсия + память.", "bridge": "К рекурсии: тот же алгоритм, но с запоминанием — классика «одна идея, две реализации, разница в тысячу раз»."}}]}, {"id": "application", "title": "Приложения", "color": "#59a14f", "nodes": [{"id": "regression", "title": "Линейная регрессия", "task": {"q": "По 5 точкам «метры → цена» прямая МНК предсказывает 4,2 млн за 50 м². Сосед продал 50 м² за 7 млн. Кто прав?", "hint": "Что важнее: одна точка или минимум суммы квадратов?", "a": "Права прямая: минимум суммы квадратов учитывает все данные, а одна продажа может быть выбросом (срочная сделка, ремонт, пентхаус). Регрессия устойчива к шуму ровно потому, что усредняет.", "bridge": "К матрице неточности: «прямая права в среднем» ещё не значит «пряма для этого конкретного клиента» — качество модели меряют отдельно."}}, {"id": "naive-bayes", "title": "Наивный Байес", "task": {"q": "В письме слово «выигрыш» встречается у спама в 50 раз чаще. Сколько «наивных» множителей складывается в оценке?", "hint": "Почему «наивный»? Что предполагается про слова?", "a": "По одному множителю на слово-признак: для письма из 200 слов — до 200 множителей. «Наивность» — предположение независимости слов (не «выигрыш» рядом с «бесплатно», а независимо). Неверное — но работающее.", "bridge": "К формуле Байеса: один тест-слово давал 9% — наивный Байес сводит силу сотен тестов в одну оценку."}}, {"id": "confusion", "title": "Матрица неточности", "task": {"q": "Модель «все здоровы» на выборке с 1% больных: точность 99%. Какая ячейка матрицы неточности её вытянула?", "hint": "Сколько TN и сколько FN у такой модели?", "a": "TN = 990, FN = 10, FP = TP = 0. Точность вытянули истинно отрицательные — лёгкий класс. Поэтому для редких событий смотрят recall и F1, а не accuracy.", "bridge": "К Монте-Карло: и там, и там ловушка одна — усреднённая метрика прячет редкие, но дорогие события."}}, {"id": "pi-estimate", "title": "Оценка π", "task": {"q": "100 точек в квадрате, 79 попали в четверть круга. Оценка π?", "hint": "Площадь четверти круга к площади квадрата относится как π/4.", "a": "π ≈ 4·79/100 = 3,16. Ошибка мала, но заметна: при 100 точках разброс порядка 0,1–0,2. Чтобы получить 3,1415, нужно ~10⁶ точек — ошибка тает как 1/√N, медленно и честно.", "bridge": "К Монте-Карло: классическая витрина метода — задача без формулы, решаемая только счётом."}}, {"id": "logic-circuits", "title": "Логические схемы", "task": {"q": "Сумматор двух битов: сумма и перенос. Какая формула даёт перенос?", "hint": "Перенос = 1, когда оба входа равны 1. Какая это функция?", "a": "Перенос = A AND B, сумма = A XOR B. Половина таблицы истинности процессора — комбинации AND, XOR, OR; «математика логики» буквально лежит в кремнии.", "bridge": "К булевым функциям: любая таблица истинности собирается из этих трёх вентилей — теорема о ДНФ в железе."}}, {"id": "navigation", "title": "Навигация", "task": {"q": "Навигатор находит путь за миллисекунды в графе из миллионов перекрёстков. Как это возможно, если Дейкстра — O((n+m)·log n)?", "hint": "Действительно ли навигатор обходит весь город?", "a": "Нет: A* и иерархии дорог (магистрали отдельно от дворов) отсекают 99% вершин — поиск направлен к цели. Дейкстра честна для всего графа, на практике нужны ускоряющие структуры.", "bridge": "К графам: теория (Дейкстра) плюс инженерия (эвристики, иерархии) — так выглядит путь от алгоритма к продукту."}}, {"id": "db-indexes", "title": "Индексы БД", "task": {"q": "Поиск по 100 млн строк без индекса — минуты. B-дерево даёт ответ за миллисекунды. Сколько сравнений примерно?", "hint": "Высота B-дерева при ветвлении 100 и 100 млн листьев?", "a": "Порядка 4–5 сравнений: 100² = 10⁴ < 100 млн < 100⁵ = 10¹⁰, высота ≈ 4–5. Логарифмическая высота при гигантском ветвлении — вот почему B-деревья, а не бинарные.", "bridge": "К деревьям: B-дерево — это бинарное дерево поиска, разжирившееся под размер блока диска."}}]}, {"id": "check", "title": "Проверка", "color": "#b07aa1", "nodes": [{"id": "test-mnk", "title": "Тест: МНК и регрессия", "task": {"q": "Разогрев: что минимизирует МНК — сумму модулей или квадратов отклонений?", "hint": "Подумайте, почему квадрат удобнее для производной.", "a": "Квадратов. У квадрата есть производная всюду (2x), у модуля — излом в нуле. Отсюда и замкнутая формула, и чувствительность к выбросам (квадрат «штрафует» большие отклонения сильнее).", "bridge": "После разогрева — сам тест: МНК, формула, интерпретация коэффициентов."}}, {"id": "test-bayes", "title": "Тест: Байес и вероятности", "task": {"q": "Разогрев: P(A|B) = P(B|A) — всегда ли?", "hint": "Возьмите редкую болезнь и точный тест.", "a": "Нет: тест положительный при болезни (P(B|A) = 0,99) не равен вероятности болезни при положительном тесте (9%). Смена условия — вся суть Байеса и главная ошибка интуиции.", "bridge": "После разогрева — задачи на пересчёт вероятностей с новыми данными."}}, {"id": "test-logic", "title": "Тест: логика и множества", "task": {"q": "Разогрев: что общего у объединения множеств и дизъюнкции?", "hint": "Запишите «x ∈ A или x ∈ B» через принадлежность объединению.", "a": "Это одна и та же операция: x ∈ A∪B ⇔ (x ∈ A) ∨ (x ∈ B). Таблицы истинности и диаграммы Венна — два языка одной алгебры (булева алгебра множеств).", "bridge": "После разогрева — перевод туда и обратно: формулы ↔ множества."}}, {"id": "test-graphs", "title": "Тест: графы и деревья", "task": {"q": "Разогрев: связный граф без циклов — сколько у него рёбер при n вершинах?", "hint": "Постройте цепочку из 3 вершин, затем 4. Видите закономерность?", "a": "n − 1. Дерево — минимальный связный граф: каждое новое ребро убирает одну «нехватку связности». Лишнее ребро — цикл, нехватка — несвязность, ровно на границе стоит n − 1.", "bridge": "После разогрева — обходы, кратчайшие пути, свойства деревьев."}}, {"id": "test-algorithms", "title": "Тест: алгоритмы", "task": {"q": "Разогрев: сортировка вставками на отсортированном массиве — O(n) или O(n²)?", "hint": "Сколько работы делает вставка, если элемент уже на месте?", "a": "O(n): каждая вставка проверяет одного соседа и останавливается. Лучший случай линейный, худший (обратный порядок) — квадратичный. Знание «только O(n²)» недостаточно — важно знать оба края.", "bridge": "После разогрева — оценка сложности и выбор структуры данных под задачу."}}]}]};
const KEY = DATA.meta.progress_key;

let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}
let filter = "all";

function save() { localStorage.setItem(KEY, JSON.stringify(done)); }

function renderBar() {
  const bar = document.getElementById("bar");
  const total = DATA.layers.reduce((s,l)=>s+l.nodes.length,0);
  const n = Object.keys(done).filter(id=>done[id]).length;
  bar.innerHTML = `<button class="chip ${filter==='all'?'active':''}" style="${filter==='all'?'background:#1c1c1e':''}" data-l="all">Все</button>`
    + DATA.layers.map(l=>`<button class="chip ${filter===l.id?'active':''}" style="${filter===l.id?`background:${l.color}`:''}" data-l="${l.id}">${l.title}</button>`).join("")
    + `<span class="counter">Решено: ${n} из ${total}</span>`;
  bar.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ filter=c.dataset.l; render(); });
}

function render() {
  renderBar();
  const main = document.getElementById("main");
  document.getElementById("note").textContent = DATA.meta.note;
  let html = "";
  for (const layer of DATA.layers) {
    if (filter !== "all" && layer.id !== filter) continue;
    html += `<h2><span class="dot" style="background:${layer.color}"></span>${layer.title}</h2>`;
    for (const node of layer.nodes) {
      const t = node.task, isDone = !!done[node.id];
      html += `<div class="task ${isDone?'done':''}" id="t-${node.id}">
        <h3>${node.title}</h3>
        <p class="q">${t.q}</p>
        <details><summary>Подсказка</summary><p>${t.hint}</p></details>
        <details><summary>Ответ</summary><p>${t.a}</p><div class="bridge"><b>Мостик:</b> ${t.bridge}</div></details>
        <button class="done-btn ${isDone?'on':''}" onclick="toggle('${node.id}')">${isDone?'Решено ✓':'Отметить решённой'}</button>
      </div>`;
    }
  }
  main.innerHTML = html;
}

function toggle(id) {
  done[id] = !done[id];
  if (!done[id]) delete done[id];
  save(); render();
}

render();
</script>
